<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#142a43">
<title>CRM André — Central de Operações</title>
<style>
:root{--navy:#142a43;--navy2:#203e5f;--red:#d92f3b;--ink:#202b38;--muted:#758191;--line:#e6eaf0;--canvas:#f5f7fa;--white:#fff;--green:#14856a;--amber:#a96a0b;--shadow:0 10px 35px #142a4310}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:245px;background:var(--navy);color:#fff;padding:24px 14px;display:flex;flex-direction:column;z-index:4}.brand{display:flex;align-items:center;gap:12px;padding:4px 10px 28px}.mark{display:grid;place-items:center;width:40px;height:40px;background:#fff;color:var(--navy);font-weight:900;border-radius:12px}.brand small{display:block;color:#bdc8d4;font-size:12px}.label{font-size:10px;letter-spacing:.15em;color:#9fb0c2;padding:10px 12px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#d8e0e8;text-align:left;padding:12px;border-radius:10px}.nav button.active,.nav button:hover{background:#ffffff18;color:#fff}.nav b{float:right;background:#ffffff20;border-radius:20px;padding:0 7px;font-size:11px}.side-foot{margin-top:auto;padding:12px;color:#b8c6d4;font-size:12px}.main{margin-left:245px;min-height:100vh}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:3}.top strong{font-weight:700}.date{color:var(--muted);font-size:13px}.content{max-width:1350px;margin:auto;padding:30px}.heading{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:24px}.heading h1{margin:0;font-size:28px;letter-spacing:-.04em}.heading p{margin:5px 0 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:9px;background:#fff;padding:10px 14px;color:var(--ink);font-weight:650}.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}.btn.danger{color:var(--red)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.stat{padding:18px}.stat-label{font-size:12px;color:var(--muted)}.stat-value{font-size:30px;font-weight:800;letter-spacing:-.04em;margin:8px 0}.stat-foot{font-size:12px;color:var(--muted)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{padding:20px;margin-bottom:16px;min-width:0}.panel h2{font-size:16px;margin:0 0 4px}.sub{color:var(--muted);font-size:12px;margin-bottom:16px}.empty{padding:28px 12px;text-align:center;color:var(--muted)}.listrow{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.listrow:last-child{border-bottom:0}.muted{color:var(--muted);font-size:12px}.searchrow{display:flex;gap:10px;margin-bottom:14px}.searchrow input{flex:1;min-width:120px}.input, input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:#fff;color:var(--ink)}textarea{min-height:90px;resize:vertical}.tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px}.table{border-collapse:collapse;width:100%;min-width:680px}.table th{text-align:left;color:var(--muted);font-size:10px;letter-spacing:.08em;background:#fafbfc}.table td,.table th{padding:13px 14px;border-bottom:1px solid var(--line)}.table tr:last-child td{border-bottom:0}.pill{display:inline-block;background:#eef2f6;border-radius:30px;padding:4px 8px;font-size:11px;font-weight:700}.pill.red{background:#fff0f1;color:var(--red)}.pill.green{background:#e8f7f2;color:var(--green)}.bar{display:flex;align-items:center;gap:12px;margin:13px 0}.bar span:first-child{width:150px;font-size:12px}.track{height:8px;flex:1;background:#eef1f5;border-radius:10px;overflow:hidden}.fill{height:100%;background:var(--navy2);border-radius:10px}.bar b{width:20px;text-align:right;font-size:12px}.overlay{position:fixed;inset:0;background:#101b2a88;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.overlay.open{display:flex}.modal{background:#fff;border-radius:16px;padding:22px;width:min(600px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 70px #0003}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h2{margin:0}.x{border:0;background:#f0f2f5;border-radius:8px;padding:6px 11px;font-size:20px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:5px;font-size:12px;font-weight:700}.field.full{grid-column:1/-1}.footbtn{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.notice{font-size:12px;color:var(--muted);margin-top:16px;border-top:1px solid var(--line);padding-top:12px}.mobilebar{display:none}
@media(max-width:900px){.side{width:210px}.main{margin-left:210px}.content{padding:22px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}
@media(max-width:650px){.side{display:none}.main{margin-left:0}.top{padding:0 16px;height:58px}.content{padding:18px 13px}.heading{display:block}.heading h1{font-size:25px}.heading .actions{margin-top:14px}.stats{gap:9px}.stat{padding:13px}.stat-value{font-size:25px}.stat-foot{font-size:11px}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.panel{padding:15px}.date{font-size:11px}.brand-mobile{font-weight:800}}
</style>
</head>
<body>
<div class="shell">
<aside class="side"><div class="brand"><div class="mark">A+</div><div><strong>CRM André</strong><small>Central de operações</small></div></div><div class="label">ESPAÇO DE TRABALHO</div><nav class="nav" id="nav"><button class="active" data-page="dashboard">◫ &nbsp; Visão geral</button><button data-page="contacts">♙ &nbsp; Contatos <b id="ncontacts">0</b></button><button data-page="deals">◈ &nbsp; Oportunidades <b id="ndeals">0</b></button><button data-page="tasks">☷ &nbsp; Tarefas <b id="ntasks">0</b></button><button data-page="activities">↗ &nbsp; Atividades</button><button data-page="points">✳ &nbsp; Pontuação</button></nav><div class="side-foot">Versão inicial online<br>Não insira dados confidenciais ainda.</div></aside>
<main class="main"><header class="top"><div><span class="brand-mobile">CRM André</span> <span style="color:#aab3bf">/</span> <strong id="section">Visão geral</strong></div><span class="date" id="today"></span></header><section class="content" id="content"></section></main>
</div>
<div class="overlay" id="overlay"><form class="modal" id="form"><div class="modalhead"><h2 id="modaltitle">Novo registro</h2><button class="x" type="button" id="x">×</button></div><div class="fields" id="fields"></div><div class="footbtn"><button class="btn" type="button" id="cancel">Cancelar</button><button class="btn primary" type="submit">Salvar</button></div></form></div>
<script>
const $=s=>document.querySelector(s), key='crm-andre-online-demo-v1';
const blank={contacts:[],deals:[],tasks:[],activities:[],points:[]};
let data=load(),page='dashboard',query='',saveHandler=null;
const labels={dashboard:'Visão geral',contacts:'Contatos',deals:'Oportunidades',tasks:'Tarefas',activities:'Atividades',points:'Pontuação'};
function load(){try{return {...blank,...JSON.parse(localStorage.getItem(key)||'{}')}}catch{return structuredClone(blank)}}
function persist(){localStorage.setItem(key,JSON.stringify(data));counts()}
function id(){return crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function date(s){if(!s)return 'Sem data';return new Date(s+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})}
function today(){return new Date().toISOString().slice(0,10)}
function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0})}
function counts(){$('#ncontacts').textContent=data.contacts.length;$('#ndeals').textContent=data.deals.filter(x=>!['Fechado','Concluído','Perdido'].includes(x.stage)).length;$('#ntasks').textContent=data.tasks.filter(x=>!x.done).length}
function head(title,sub,buttons=''){return '<div class="heading"><div><h1>'+title+'</h1><p>'+sub+'</p></div><div class="actions">'+buttons+'</div></div>'}
function btn(text,action,primary=true){return '<button class="btn '+(primary?'primary':'')+'" data-action="'+action+'">＋ '+text+'</button>'}
function panel(title,sub,body){return '<section class="panel"><h2>'+title+'</h2><div class="sub">'+sub+'</div>'+body+'</section>'}
function empty(msg){return '<div class="empty">'+msg+'</div>'}
function taskList(list){if(!list.length)return empty('Nenhuma tarefa pendente. Registre o próximo passo de cada oportunidade.');return list.slice(0,6).map(t=>'<div class="listrow"><div><strong>'+esc(t.title)+'</strong><div class="muted">'+esc(t.contactName||'Sem contato')+' · '+date(t.due)+'</div></div><button class="btn" data-action="toggle-task" data-id="'+t.id+'">'+(t.done?'Reabrir':'Concluir')+'</button></div>').join('')}
function dashboard(){let tasks=data.tasks.filter(t=>!t.done).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')),open=data.deals.filter(d=>!['Fechado','Concluído','Perdido'].includes(d.stage)),points=data.points.reduce((s,p)=>s+Number(p.value||0),0),todayTasks=tasks.filter(t=>!t.due||t.due<=today()),returns=tasks.filter(t=>t.kind==='Retorno prometido');let stageNames=['Novo lead','Contato feito','Qualificação','Busca / atendimento','Visita','Proposta / negociação'];let max=Math.max(1,...stageNames.map(s=>open.filter(d=>d.stage===s).length));let bars=stageNames.map(s=>'<div class="bar"><span>'+s+'</span><div class="track"><div class="fill" style="width:'+(open.filter(d=>d.stage===s).length/max*100)+'%"></div></div><b>'+open.filter(d=>d.stage===s).length+'</b></div>').join('');return head('Bom trabalho, André.','Aqui está o que merece sua atenção hoje.',btn('Nova tarefa','new-task')+btn('Adicionar contato','new-contact',false))+'<div class="stats"><div class="stat"><div class="stat-label">Oportunidades abertas</div><div class="stat-value">'+open.length+'</div><div class="stat-foot">Em todos os funis</div></div><div class="stat"><div class="stat-label">Tarefas para hoje</div><div class="stat-value">'+todayTasks.length+'</div><div class="stat-foot">'+tasks.filter(t=>t.due&&t.due<today()).length+' atrasada(s)</div></div><div class="stat"><div class="stat-label">Retornos prometidos</div><div class="stat-value">'+returns.length+'</div><div class="stat-foot">Retornos registrados</div></div><div class="stat"><div class="stat-label">Pontos acumulados</div><div class="stat-value">'+points+'</div><div class="stat-foot">Lançamentos manuais</div></div></div><div class="grid2">'+panel('Funil comercial','Oportunidades abertas por etapa',bars)+panel('Próximas ações','Tarefas ordenadas por prazo',taskList(tasks))+'</div>'+panel('Últimas atividades','Histórico recente',data.activities.slice().reverse().slice(0,5).map(a=>'<div class="listrow"><div><strong>'+esc(a.type)+'</strong><div>'+esc(a.description)+'</div><div class="muted">'+date(a.date)+' · '+esc(a.contactName||'')+'</div></div></div>').join('')||empty('Ainda não há atividades.'))}
function table(headers,rows){return '<div class="tablewrap"><table class="table"><thead><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows+'</tbody></table></div>'}
function contacts(){let list=data.contacts.filter(c=>(c.name+' '+c.phone+' '+c.email+' '+c.roles+' '+c.source).toLowerCase().includes(query.toLowerCase()));let rows=list.map(c=>'<tr><td><strong>'+esc(c.name)+'</strong><div class="muted">'+esc(c.location||'')+'</div></td><td>'+esc(c.phone||'—')+'<div class="muted">'+esc(c.email||'')+'</div></td><td>'+esc(c.roles||'Contato')+'</td><td>'+esc(c.source||'—')+'</td><td><span class="pill">'+esc(c.rank||'C')+'</span></td><td><button class="btn" data-action="edit-contact" data-id="'+c.id+'">Editar</button></td></tr>').join('');return head('Contatos','Uma pessoa por cadastro, com papéis e histórico unificados.',btn('Adicionar contato','new-contact'))+'<div class="searchrow"><input id="search" placeholder="Buscar por nome, telefone, e-mail..." value="'+esc(query)+'"></div>'+table(['CONTATO','TELEFONE / E-MAIL','PAPÉIS','ORIGEM','RANK',''],rows||'<tr><td colspan="6">'+empty('Nenhum contato encontrado.')+'</td></tr>')}
const stages=['Novo lead','Contato feito','Qualificação','Busca / atendimento','Visita','Proposta / negociação','Negociação','Contrato','Fechado','Perdido'];
function deals(){let list=data.deals.filter(d=>(d.title+' '+d.contactName+' '+d.kind+' '+d.stage).toLowerCase().includes(query.toLowerCase()));return head('Oportunidades','Acompanhe vendas, locações e captação de imóveis.',btn('Nova oportunidade','new-deal'))+'<div class="searchrow"><input id="search" placeholder="Buscar oportunidade..." value="'+esc(query)+'"></div>'+table(['OPORTUNIDADE','MODALIDADE','CONTATO','ETAPA','VALOR','PRÓXIMO PASSO',''],list.map(d=>'<tr><td><strong>'+esc(d.title)+'</strong></td><td>'+esc(d.kind)+'</td><td>'+esc(d.contactName||'—')+'</td><td><span class="pill '+(d.stage==='Fechado'?'green':d.stage==='Perdido'?'red':'')+'">'+esc(d.stage)+'</span></td><td>'+money(d.value)+'</td><td>'+esc(d.nextAction||'—')+'<div class="muted">'+date(d.nextDate)+'</div></td><td><button class="btn" data-action="edit-deal" data-id="'+d.id+'">Editar</button></td></tr>').join('')||'<tr><td colspan="7">'+empty('Nenhuma oportunidade encontrada.')+'</td></tr>')}
function tasks(){let list=data.tasks.filter(t=>(t.title+' '+t.contactName+' '+t.kind).toLowerCase().includes(query.toLowerCase())).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));return head('Tarefas e retornos','Compromissos, prazos e próximos passos.',btn('Nova tarefa','new-task'))+'<div class="searchrow"><input id="search" placeholder="Buscar tarefa..." value="'+esc(query)+'"></div>'+table(['TAREFA','CONTATO','TIPO','PRAZO','PRIORIDADE','STATUS',''],list.map(t=>'<tr><td><strong>'+esc(t.title)+'</strong></td><td>'+esc(t.contactName||'—')+'</td><td>'+esc(t.kind)+'</td><td>'+date(t.due)+'</td><td>'+esc(t.priority)+'</td><td><span class="pill '+(t.done?'green':'')+'">'+(t.done?'Concluída':'Pendente')+'</span></td><td><button class="btn" data-action="toggle-task" data-id="'+t.id+'">'+(t.done?'Reabrir':'Concluir')+'</button></td></tr>').join('')||'<tr><td colspan="7">'+empty('Nenhuma tarefa encontrada.')+'</td></tr>')}
function activities(){return head('Atividades','Registre ligações, conversas, visitas, follow-ups e resultados.',btn('Registrar atividade','new-activity'))+panel('Histórico','Mais recentes primeiro',data.activities.slice().reverse().map(a=>'<div class="listrow"><div><strong>'+esc(a.type)+' — '+esc(a.description)+'</strong><div class="muted">'+date(a.date)+' · '+esc(a.contactName||'Sem contato')+'</div></div><span class="pill">'+Number(a.points||0)+' pts</span></div>').join('')||empty('Nenhuma atividade registrada.'))}
function points(){let total=data.points.reduce((s,p)=>s+Number(p.value||0),0);return head('Pontuação','Atividade e resultados com lançamentos auditáveis.',btn('Registrar pontos','new-points'))+'<div class="stats"><div class="stat"><div class="stat-label">Saldo de pontos</div><div class="stat-value">'+total+'</div><div class="stat-foot">Soma dos lançamentos</div></div><div class="stat"><div class="stat-label">Lançamentos</div><div class="stat-value">'+data.points.length+'</div><div class="stat-foot">Histórico manual</div></div></div>'+panel('Histórico de pontos','Valores positivos ou negativos justificados',data.points.slice().reverse().map(p=>'<div class="listrow"><div><strong>'+esc(p.type)+'</strong><div>'+esc(p.description)+'</div><div class="muted">'+date(p.date)+'</div></div><strong>'+(Number(p.value)>0?'+':'')+Number(p.value)+'</strong></div>').join('')||empty('Nenhum lançamento de pontos.'))}
function render(){let f={dashboard,contacts,deals,tasks,activities,points}[page]||dashboard;$('#content').innerHTML=f();$('#section').textContent=labels[page];$('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));counts()}
function field(name,label,type='text',opts={}){return {name,label,type,...opts}}
function openForm(title,fields,handler,existing={}){$('#modaltitle').textContent=title;$('#fields').innerHTML=fields.map(f=>'<label class="field '+(f.full?'full':'')+'">'+f.label+(f.type==='select'?'<select name="'+f.name+'" '+(f.required?'required':'')+'>'+f.options.map(o=>'<option value="'+esc(typeof o==='string'?o:o.value)+'" '+((existing[f.name]??f.value??(typeof o==='string'?o:o.value))===(typeof o==='string'?o:o.value)?'selected':'')+'>'+esc(typeof o==='string'?o:o.label)+'</option>').join('')+'</select>':f.type==='textarea'?'<textarea name="'+f.name+'" '+(f.required?'required':'')+'>'+esc(existing[f.name]??f.value??'')+'</textarea>':'<input name="'+f.name+'" type="'+f.type+'" value="'+esc(existing[f.name]??f.value??'')+'" '+(f.required?'required':'')+' '+(f.min!==undefined?'min="'+f.min+'"':'')+' '+(f.step?'step="'+f.step+'"':'')+' placeholder="'+esc(f.placeholder||'')+'">')+'</label>').join('');saveHandler=handler;$('#overlay').classList.add('open')}
function closeForm(){$('#overlay').classList.remove('open');saveHandler=null}
function contactOptions(){return [{value:'',label:'Sem contato associado'},...data.contacts.map(c=>({value:c.id,label:c.name}))]}
function contactForm(c){c=c||{};openForm(c.id?'Editar contato':'Novo contato',[field('name','Nome completo','text',{required:true,full:true}),field('phone','Telefone / WhatsApp','tel'),field('email','E-mail','email'),field('roles','Papéis','text',{placeholder:'Comprador, proprietário, locatário...'}),field('source','Origem do contato'),field('location','Cidade / região'),field('rank','Classificação','select',{options:['A','B','C','D','E','F','O'],value:'C'}),field('birthday','Aniversário','date'),field('notes','Notas relevantes','textarea',{full:true})],v=>{let duplicate=data.contacts.find(x=>x.id!==c.id&&((v.phone&&x.phone===v.phone)||(v.email&&x.email&&x.email.toLowerCase()===v.email.toLowerCase())));if(duplicate&&!confirm('Telefone/e-mail parecido com '+duplicate.name+'. Salvar mesmo assim?'))return false;if(c.id)Object.assign(c,v);else data.contacts.push({id:id(),...v});log('Contato',c.id?'Contato atualizado: ':'Contato criado: '+v.name,'');persist();render();closeForm()},c)}
function dealForm(d){d=d||{};openForm(d.id?'Editar oportunidade':'Nova oportunidade',[field('title','Nome da oportunidade','text',{required:true,full:true}),field('kind','Modalidade','select',{options:['Venda','Locação de temporada','Locação tradicional','Captação de imóvel']}),field('contactId','Contato','select',{options:contactOptions()}),field('stage','Etapa','select',{options:stages,value:'Novo lead'}),field('value','Valor estimado (R$)','number',{min:0,step:'0.01'}),field('source','Origem da oportunidade'),field('nextAction','Próximo passo','text',{full:true}),field('nextDate','Data do próximo passo','date'),field('notes','Notas','textarea',{full:true})],v=>{let c=data.contacts.find(x=>x.id===v.contactId);let row={...v,contactName:c?.name||''};if(d.id)Object.assign(d,row);else data.deals.push({id:id(),...row,createdAt:new Date().toISOString()});log('Oportunidade',v.title,c?.name||'');persist();render();closeForm()},d)}
function taskForm(){openForm('Nova tarefa',[field('title','Descrição da tarefa','text',{required:true,full:true}),field('contactId','Contato','select',{options:contactOptions()}),field('kind','Tipo','select',{options:['Tarefa','Retorno prometido','Follow-up','Prazo']}),field('due','Prazo','date',{value:today()}),field('priority','Prioridade','select',{options:['Alta','Média','Baixa'],value:'Média'}),field('notes','Observações','textarea',{full:true})],v=>{let c=data.contacts.find(x=>x.id===v.contactId);data.tasks.push({id:id(),...v,contactName:c?.name||'',done:false});log('Tarefa',v.title,c?.name||'');persist();render();closeForm()})}
function log(type,description,contactName='',points=0){data.activities.push({id:id(),type,description,contactName,date:today(),points});if(points)data.points.push({id:id(),type,description,date:today(),value:points})}
function activityForm(){openForm('Registrar atividade',[field('type','Tipo','select',{options:['Ligação','Conversa','Follow-up','Visita','R1','R2','CRE','Captação','Contrato assinado','Aprendizado']}),field('contactId','Contato','select',{options:contactOptions()}),field('description','Resumo do que aconteceu','textarea',{required:true,full:true}),field('points','Pontos desta atividade','number',{min:0,step:1,value:0})],v=>{let c=data.contacts.find(x=>x.id===v.contactId);log(v.type,v.description,c?.name||'',Number(v.points)||0);persist();render();closeForm()})}
function pointsForm(){openForm('Registrar pontos',[field('type','Categoria','select',{options:['Atividade','Resultado','Ajuste']}),field('value','Pontos (+/-)','number',{required:true,step:1}),field('description','Descrição e justificativa','textarea',{required:true,full:true})],v=>{data.points.push({id:id(),date:today(),...v,value:Number(v.value)});persist();render();closeForm()})}
function action(a,idv){if(a==='new-contact')contactForm();if(a==='edit-contact')contactForm(data.contacts.find(x=>x.id===idv));if(a==='new-deal')dealForm();if(a==='edit-deal')dealForm(data.deals.find(x=>x.id===idv));if(a==='new-task')taskForm();if(a==='new-activity')activityForm();if(a==='new-points')pointsForm();if(a==='toggle-task'){let t=data.tasks.find(x=>x.id===idv);if(t){t.done=!t.done;if(t.done)log('Follow-up','Tarefa concluída: '+t.title,t.contactName);persist();render()}}}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b){page=b.dataset.page;query='';render()}});
$('#content').addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(b)action(b.dataset.action,b.dataset.id)});
$('#content').addEventListener('input',e=>{if(e.target.id==='search'){let pos=e.target.selectionStart;query=e.target.value;render();let n=$('#search');if(n){n.focus();n.setSelectionRange(pos,pos)}}});
$('#form').addEventListener('submit',e=>{e.preventDefault();if(!saveHandler)return;let v=Object.fromEntries(new FormData(e.currentTarget));let r=saveHandler(v);if(r!==false&&$('#overlay').classList.contains('open'))closeForm()});
$('#x').onclick=closeForm;$('#cancel').onclick=closeForm;$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeForm()});
$('#today').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
render();
</script>
</body></html>
